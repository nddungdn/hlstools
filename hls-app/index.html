{id:'poem-deongang',title:'Qua Đèo Ngang',author:'Bà Huyện Thanh Quan',genre:'Thơ',grade:8,source:'Tác phẩm thuộc phạm vi công cộng; dùng làm ngữ liệu minh họa.',editable:false,body:'Bước tới Đèo Ngang, bóng xế tà,\nCỏ cây chen đá, lá chen hoa.\nLom khom dưới núi, tiều vài chú,\nLác đác bên sông, chợ mấy nhà.\nNhớ nước đau lòng, con quốc quốc,\nThương nhà mỏi miệng, cái gia gia.\nDừng chân đứng lại, trời, non, nước,\nMột mảnh tình riêng, ta với ta.',questions:[{id:'dq1',q:'Ghi lại hai từ ngữ gợi hình trong hai câu thực và nhận xét tác dụng của chúng.'},{id:'dq2',q:'Dựa vào những hình ảnh và từ ngữ trong bài, em nhận xét thế nào về tâm trạng của nhân vật trữ tình?'},{id:'dq3',q:'Lựa chọn một dẫn chứng và giải thích mối quan hệ giữa cảnh vật với tình cảm của người viết.'}]},
{id:'prose-santruong',title:'Sân trường sau cơn mưa',author:'Ngữ liệu tự biên soạn – HLS',genre:'Truyện ngắn',grade:6,source:'Ngữ liệu do HLS biên soạn để minh họa cách đọc hiểu.',editable:false,body:'Tiếng trống báo giờ ra chơi vừa dứt thì cơn mưa bất chợt đổ xuống. Minh đứng nép dưới hiên lớp, nhìn những giọt nước nối nhau rơi trên chiếc ghế đá.\n\nỞ cuối sân, một chậu cây nhỏ bị gió xô nghiêng. Minh định chạy ra nhưng lại chần chừ vì đôi giày mới. Đúng lúc ấy, Lan đặt chiếc ô vào tay bạn: “Mình đi cùng nhé!”.\n\nHai bạn cùng dựng chậu cây trở lại. Mấy hạt đất bám lên tay áo, nhưng Minh không còn để ý. Khi mưa tạnh, ánh nắng chiếu qua tán phượng, làm sân trường lấp lánh. Minh nhìn chiếc lá non và mỉm cười.',questions:[{id:'sq1',q:'Nêu sự việc chính trong câu chuyện.'},{id:'sq2',q:'Chi tiết nào cho thấy sự thay đổi trong suy nghĩ hoặc hành động của Minh?'},{id:'sq3',q:'Từ câu chuyện, em rút ra một điều có ý nghĩa cho bản thân. Dẫn một chi tiết để lí giải.'}]}
];

'feel':{name:'Đoạn văn nêu cảm nhận',steps:[['Nêu cảm nhận','Nêu cảm xúc hoặc ấn tượng chính của em.'],['Dẫn chứng','Chọn chi tiết, hình ảnh hoặc câu văn cụ thể.'],['Lí giải','Giải thích vì sao dẫn chứng ấy tạo nên cảm nhận của em.'],['Khái quát','Khẳng định điều em thấy ý nghĩa.']]},
'argument':{name:'Đoạn nghị luận xã hội',steps:[['Vấn đề','Xác định vấn đề và quan điểm.'],['Lí lẽ','Trình bày lí do bảo vệ quan điểm.'],['Bằng chứng','Nêu ví dụ phù hợp, có thật hoặc tình huống rõ ràng.'],['Bàn luận','Xem xét một khía cạnh bổ sung hoặc phản biện hợp lí.'],['Kết','Rút ra nhận xét hoặc bài học.']]},
'essay':{name:'Dàn ý và bài văn phân tích',steps:[['Mở bài','Giới thiệu tác giả, tác phẩm và nhận xét chung.'],['Luận điểm 1','Xác định chủ đề hoặc vấn đề cần phân tích cùng căn cứ.'],['Luận điểm 2','Phân tích một phương diện nổi bật; lựa chọn chứng cứ và lí giải.'],['Luận điểm 3','Phân tích thêm một phương diện; làm rõ vai trò của nghệ thuật.'],['Kết bài','Đánh giá giá trị, ý nghĩa hoặc thông điệp của văn bản.']]}

function homeView(){let totalDrafts=Object.values(db.drafts).filter(d=>d.full.trim()||Object.values(d.steps||{}).some(Boolean)).length;let answers=Object.values(db.sessions).reduce((a,s)=>a+Object.values(s.answers||{}).filter(v=>String(v).trim()).length,0);return `<section class="hero"><div><div class="eyebrow">NGỮ VĂN · LỚP 6–12</div><h1>Đọc để hiểu.<br>Viết để trưởng thành.</h1><p>Một không gian rèn luyện Ngữ văn qua từng bước: khám phá văn bản, tìm chứng cứ, hình thành ý tưởng và tự sửa bài viết.</p><button class="btn" data-go="reading">Bắt đầu đọc hiểu →</button></div><div class="hero-visual" aria-hidden="true">文</div></section><div class="section-title"><h2>Không gian thực hành</h2><span class="meta">Phiên bản 0.1 · Không cần API key</span></div><div class="cards"><div class="card clickable" data-go="reading" role="button" tabindex="0"><div class="card-icon">▤</div><h3>Phòng đọc hiểu</h3><p>Đọc văn bản, đánh dấu chi tiết, chọn bằng chứng và trả lời câu hỏi.</p><span class="btn secondary small">Vào phòng đọc →</span></div><div class="card clickable" data-go="writing" role="button" tabindex="0"><div class="card-icon goldbg">✎</div><h3>Xưởng viết</h3><p>Tìm ý, viết theo bước, hoàn thiện đoạn văn hoặc bài văn và lưu các bản nháp.</p><span class="btn secondary small">Bắt đầu viết →</span></div><div class="card clickable" data-go="library" role="button" tabindex="0"><div class="card-icon greenbg">▦</div><h3>Kho ngữ liệu</h3><p>Sử dụng văn bản mẫu hoặc thêm ngữ liệu do giáo viên lựa chọn, có nguồn rõ ràng.</p><span class="btn secondary small">Mở thư viện →</span></div></div><div class="statrow"><div class="stat"><b>${db.texts.length}</b><span>Văn bản trong thư viện</span></div><div class="stat"><b>${answers}</b><span>Câu trả lời đã lưu</span></div><div class="stat"><b>${totalDrafts}</b><span>Bản thảo đang thực hành</span></div></div><div class="notice">Bản 0.1 lưu dữ liệu trong trình duyệt trên thiết bị hiện tại. Chưa có đăng nhập, đồng bộ giữa các máy hoặc hệ thống chấm điểm trực tuyến. Có chức năng xuất/nhập dữ liệu để sao lưu và chuyển bài thủ công.</div>`;}
function libraryView(){let items=db.texts.filter(t=>t.grade===db.grade);return `<div class="headrow"><div><div class="eyebrow">THƯ VIỆN</div><h1>Kho ngữ liệu đọc – viết</h1><p>Văn bản mẫu và ngữ liệu do giáo viên nhập. Lựa chọn từ thư viện để đọc hoặc viết.</p></div><div class="head-actions"><button class="btn secondary" data-action="open-add-text">+ Thêm văn bản</button></div></div><div class="panel"><div class="panel-header"><h2>Ngữ liệu lớp ${db.grade}</h2><span class="tag">${items.length} văn bản</span></div>${items.length?`<div class="list">${items.map(t=>`<div class="list-item"><div><h3>${title(t)}</h3><div class="meta">${escapeHtml(t.author)} · ${escapeHtml(t.genre)}</div><p>${escapeHtml(short(t.body.replace(/\n/g,' '),125))}</p><span class="tag">${escapeHtml(t.source||'Chưa ghi nguồn')}</span></div><div class="actions"><button class="btn secondary small" data-action="read-text" data-id="${escapeHtml(t.id)}">Đọc</button><button class="btn small" data-action="write-text" data-id="${escapeHtml(t.id)}">Viết</button>${t.editable?`<button class="btn danger small" data-action="remove-text" data-id="${escapeHtml(t.id)}">Xóa</button>`:''}</div></div>`).join('')}</div>`:'<div class="empty">Chưa có văn bản cho khối lớp này. Chọn “Thêm văn bản” để bổ sung ngữ liệu.</div>'}</div><div class="notice">Chỉ nhập văn bản được phép khai thác. Chức năng lưu hiện trên trình duyệt và không tự động công bố ngữ liệu lên Internet.</div>`;}

function readingView(){let t=currentText(),s=session(t.id),done=t.questions.filter(q=>(s.answers[q.id]||'').trim()).length;return `<div class="headrow"><div><div class="eyebrow">R01 · PHÒNG ĐỌC HIỂU</div><h1>Khám phá văn bản</h1><p>Quan sát – chọn chứng cứ – giải thích – hình thành nhận xét.</p></div><div class="head-actions"><button class="btn secondary" data-action="clear-pending">Bỏ vùng chọn</button><button class="btn" data-go="writing">Chuyển sang viết →</button></div></div><div class="twocol"><section class="panel"><div class="form-grid"><div class="field"><label for="textPick">Chọn văn bản</label><select id="textPick">${textOptions(selectedText)}</select></div><div class="field"><label for="assignPick">Bài tập</label><select id="assignPick">${assignOptions()}</select></div></div><div class="panel-header"><div><h2>${title(t)}</h2><div class="meta">${escapeHtml(t.author)} · ${escapeHtml(t.genre)} · Lớp ${t.grade}</div></div><span class="pill">Đang đọc</span></div><div id="readerText" class="reader-text" tabindex="0" aria-label="Văn bản đọc, có thể chọn từ ngữ để đánh dấu"></div><div class="toolstrip"><button class="btn secondary small" data-action="mark-yellow">Tô vàng</button><button class="btn secondary small" data-action="mark-blue">Tô xanh</button><button class="btn secondary small" data-action="mark-green">Tô lục</button><button class="btn gold small" data-action="add-evidence">+ Dẫn chứng</button><span id="selectionStatus" class="small muted">Bôi chọn một đoạn văn bản trước khi thao tác.</span></div><details><summary class="small muted">Nguồn và ghi chú ngữ liệu</summary><p class="small">${escapeHtml(t.source||'Chưa có thông tin nguồn')}</p></details></section><section><div class="panel"><div class="panel-header"><h2>Nhiệm vụ đọc</h2><span class="tag">${done}/${t.questions.length} câu</span></div><div class="list">${t.questions.map((q,i)=>`<div class="field"><label for="answer-${escapeHtml(q.id)}">${i+1}. ${escapeHtml(q.q)}</label><textarea id="answer-${escapeHtml(q.id)}" data-answer="${escapeHtml(q.id)}" placeholder="Ghi lại suy nghĩ của em…">${escapeHtml(s.answers[q.id]||'')}</textarea></div>`).join('')}</div><p class="small muted">Câu trả lời được lưu ngay trên thiết bị. Có thể sửa nhiều lần.</p></div><div class="panel"><div class="panel-header"><h2>Sổ dẫn chứng</h2><span class="tag">${s.evidence.length} mục</span></div>${s.evidence.length?s.evidence.map(e=>`<div class="excerpt">“${escapeHtml(short(e.text,300))}”<div class="actions" style="margin-top:8px"><button class="btn ghost small" data-action="remove-evidence" data-id="${escapeHtml(e.id)}">Bỏ dẫn chứng</button></div></div>`).join(''):'<div class="empty">Bôi chọn chi tiết trong văn bản rồi bấm “+ Dẫn chứng”.</div>'}<div class="divider"></div><button class="btn" data-go="writing">Dùng chứng cứ để viết →</button></div><div class="panel"><h3>Gợi ý tự kiểm tra</h3><div class="checkrow">□ Em đã trả lời đúng trọng tâm câu hỏi?</div><div class="checkrow">□ Em đã tìm được chi tiết làm căn cứ?</div><div class="checkrow">□ Em đã giải thích thay vì chỉ chép lại?</div></div></section></div>`;}
function drawReaderText(){let t=currentText(),s=session(t.id),ele=byId('readerText');if(!ele)return;ele.replaceChildren();let marks=[...(s.marks||[])].filter(m=>Number.isInteger(m.start)&&Number.isInteger(m.end)&&m.start>=0&&m.end<=t.body.length&&m.end>m.start).sort((a,b)=>a.start-b.start);let from=0;for(let m of marks){if(m.start<from)continue;if(m.start>from)ele.append(document.createTextNode(t.body.slice(from,m.start)));let node=document.createElement('mark');node.className=m.color==='blue'?'blue':m.color==='green'?'green':'';node.textContent=t.body.slice(m.start,m.end);node.title=m.note||'Đã đánh dấu';ele.appendChild(node);from=m.end;}if(from<t.body.length)ele.append(document.createTextNode(t.body.slice(from)));}
function storeSelection(){let root=byId('readerText'),sel=window.getSelection();if(!root||!sel||sel.isCollapsed||!sel.rangeCount)return;let range=sel.getRangeAt(0);if(!root.contains(range.startContainer)||!root.contains(range.endContainer))return;let bef=range.cloneRange();bef.selectNodeContents(root);bef.setEnd(range.startContainer,range.startOffset);let start=bef.toString().length;let end=start+range.toString().length;let t=currentText();if(end<=start||end>t.body.length||end-start>1200)return;pendingSelection={textId:t.id,start,end,text:t.body.slice(start,end)};let s=byId('selectionStatus');if(s)s.textContent='Đã chọn: “'+short(pendingSelection.text.replace(/\n/g,' '),68)+'”';}
function addMark(color){if(!pendingSelection||pendingSelection.textId!==selectedText){notify('Hãy bôi chọn từ ngữ hoặc câu văn trong vùng đọc trước.');return;}let s=session(selectedText);let {start,end}=pendingSelection;if(s.marks.some(m=>start<m.end&&end>m.start)){notify('Vùng được chọn trùng phần đã tô màu.');return;}s.marks.push({id:uid(),start,end,color,note:''});s.updatedAt=now();persist();pendingSelection=null;let scroll=window.scrollY;render();window.scrollTo(0,scroll);notify('Đã đánh dấu dẫn chứng trên văn bản.');}
function addEvidence(){if(!pendingSelection||pendingSelection.textId!==selectedText){notify('Hãy bôi chọn một câu hoặc chi tiết trong văn bản trước.');return;}let s=session(selectedText);if(!s.evidence.some(e=>e.start===pendingSelection.start&&e.end===pendingSelection.end))s.evidence.push({...pendingSelection,id:uid()});persist();pendingSelection=null;let scroll=window.scrollY;render();window.scrollTo(0,scroll);notify('Đã lưu vào Sổ dẫn chứng.');}
function writingView(){let t=currentText(),tp=templates[templateId],d=draft(),s=session(t.id),a=assignment(),evid=s.evidence||[];return `<div class="headrow"><div><div class="eyebrow">W01–W02 · XƯỞNG VIẾT NGỮ VĂN</div><h1>Từ dẫn chứng đến bài viết</h1><p>Viết theo từng bước, hoàn thiện bài và lưu lại quá trình chỉnh sửa.</p></div><div class="head-actions"><button class="btn secondary" data-action="export-writing">↓ Xuất bài TXT</button><button class="btn" data-action="snapshot">Lưu phiên bản</button></div></div><div class="panel"><div class="form-grid"><div class="field"><label for="textPick">Ngữ liệu</label><select id="textPick">${textOptions(selectedText)}</select></div><div class="field"><label for="assignPick">Bài tập</label><select id="assignPick">${assignOptions()}</select></div><div class="field"><label for="templatePick">Hình thức luyện viết</label><select id="templatePick">${Object.entries(templates).map(([key,val])=>`<option value="${key}" ${key===templateId?'selected':''}>${escapeHtml(val.name)}</option>`).join('')}</select></div><div class="field"><label for="writingPrompt">Đề bài</label><input id="writingPrompt" value="${escapeHtml(d.prompt||a?.prompt||'Viết đoạn văn phân tích một đặc sắc nghệ thuật của văn bản.')}" maxlength="1000"></div></div><div class="meta">Tác phẩm/ngữ liệu: ${title(t)} · ${escapeHtml(t.author)} <span id="saveStatus">• Tự động lưu trên máy</span></div></div><div class="twocol" style="margin-top:17px"><section><div class="panel"><div class="panel-header"><h2>1. Tìm ý và viết theo bước</h2><span class="tag">${escapeHtml(tp.name)}</span></div>${tp.steps.map(([name,desc],i)=>`<div class="step"><strong>${i+1}. ${escapeHtml(name)}</strong><p>${escapeHtml(desc)}</p><textarea data-step="${i}" placeholder="Viết ý hoặc câu văn của em tại đây…">${escapeHtml(d.steps[i]||'')}</textarea></div>`).join('')}<div class="actions"><button class="btn" data-action="compose">Tạo bản nháp từ các bước →</button><button class="btn secondary" data-action="c function wireDraftStatus(){const d=draft();let prompt=byId('writingPrompt');if(prompt && !d.prompt){d.prompt=prompt.value;persist();}}
function teacherView(){return `<div class="headrow"><div><div class="eyebrow">GÓC GIÁO VIÊN · QUẢN LÍ BÀI TẬP</div><h1>Giao bài và nhận bài</h1><p>Tạo nhiệm vụ, xuất tệp để chuyển cho học sinh; nhập bài nộp về máy giáo viên.</p></div><div class="head-actions"><button class="btn secondary" data-action="import-assignment">↑ Nhập bài tập</button><button class="btn secondary" data-action="import-submission">↑ Nhập bài nộp</button></div></div><div class="notice">Chế độ thí điểm ngoại tuyến: trang này chưa có đăng nhập hay phân quyền thật. Giáo viên giao bài bằng tệp JSON; học sinh gửi lại bài bằng tệp JSON. Chưa có giao/nộp trực tuyến giữa các thiết bị.</div><div class="twocol"><section class="panel"><h2>Tạo nhiệm vụ mới</h2><div class="field"><label for="taskTitle">Tên nhiệm vụ</label><input id="taskTitle" maxlength="160" placeholder="VD: Đọc hiểu Qua Đèo Ngang – lớp 8"></div><div class="form-grid"><div class="field"><label for="taskText">Ngữ liệu</label><select id="taskText">${textOptions(selectedText)}</select></div><div class="field"><label for="taskClass">Lớp / nhóm</label><input id="taskClass" maxlength="50" placeholder="VD: 8/1"></div></div><div class="field"><label for="taskPrompt">Nhiệm vụ viết</label><textarea id="taskPrompt" maxlength="1000" placeholder="Nêu yêu cầu viết dựa trên ngữ liệu này…"></textarea></div><button class="btn" data-action="create-assignment">+ Tạo và lưu nhiệm vụ</button></section><section class="panel"><div class="panel-header"><h2>Nhiệm vụ đã tạo / nhập</h2><span class="tag">${db.assignments.length} nhiệm vụ</span></div>${db.assignments.length?`<div class="list">${db.assignments.slice().reverse().map(a=>`<div class="list-item"><div><h3>${escapeHtml(a.title)}</h3><div class="meta">${escapeHtml(a.classLabel||'Tự luyện')} · ${escapeHtml(textOf(a.textId)?.title||'')} · ${escapeHtml(fmt(a.createdAt))}</div><p>${escapeHtml(short(a.prompt||'',145))}</p><div class="actions" style="margin-top:10px"><button class="btn secondary small" data-action="export-assignment" data-id="${escapeHtml(a.id)}">↓ Tải bài giao</button><button class="btn secondary small" data-action="open-assignment" data-id="${escapeHtml(a.id)}">Mở bài</button></div></div></div>`).join('')}</div>`:'<div class="empty">Chưa có nhiệm vụ. Tạo một bài từ biểu mẫu bên trái.</div>'}</section></div><section class="panel" style="margin-top:18px"><div class="panel-header"><h2>Bài học sinh đã gửi về</h2><span class="tag">${db.submissions.length} bài nộp đã nhập</span></div>${db.submissions.length?`<div class="list">${db.submissions.slice().reverse().map(s=>`<div class="list-item"><div><h3>${escapeHtml(s.studentCode||'Không có mã')} · ${escapeHtml(s.assignmentTitle||'Bài viết')}</h3><div class="meta">${escapeHtml(fmt(s.submittedAt))} · ${countWords(s.content||'')} từ</div><p>${escapeHtml(short(s.content||'',240))}</p></div><div class="actions"><button class="btn secondary small" data-action="inspect-submission" data-id="${escapeHtml(s.id)}">Xem toàn bài</button></div></div>`).join('')}</div>`:'<div class="empty">Chưa nhập bài nộp nào. Chọn “Nhập bài nộp” và mở tệp JSON do học sinh xuất.</div>'}</section>`;}
function progressView(){const sessions=Object.entries(db.sessions).filter(([k,s])=>Object.values(s.answers||{}).some(Boolean)||s.evidence?.length);const drafts=Object.entries(db.drafts).filter(([k,d])=>d.full.trim()||Object.values(d.steps).some(Boolean));const versions=drafts.reduce((n,[k,d])=>n+(d.versions||[]).length,0);return `<div class="headrow"><div><div class="eyebrow">HỒ SƠ TỰ HỌC</div><h1>Quá trình luyện tập</h1><p>Những gì đã đọc, đã viết và các phiên bản bài làm đang lưu trên trình duyệt này.</p></div><div class="head-actions"><button class="btn" data-action="export-backup">↓ Sao lưu toàn bộ</button><button class="btn secondary" data-action="import-backup">↑ Khôi phục</button></div></div><div class="statrow" style="margin-bottom:20px"><div class="stat"><b>${sessions.length}</b><span>Văn bản đã thực hành</span></div><div class="stat"><b>${drafts.length}</b><span>Bài viết đang lưu</span></div><div class="stat"><b>${versions}</b><span>Phiên bản bài viết</span></div></div><div class="twocol equal"><div class="panel"><h2>Hoạt động đọc</h2>${sessions.length?sessions.map(([id,s])=>`<div class="list-item"><div><h3>${escapeHtml(textOf(id)?.title||'Ngữ liệu')}</h3><div class="meta">${Object.values(s.answers||{}).filter(Boolean).length} câu trả lời · ${s.evidence?.length||0} dẫn chứng</div></div><button class="btn secondary small" data-action="read-text" data-id="${escapeHtml(id)}">Xem</button></div>`).join(''):'<div class="empty">Chưa có hoạt động đọc được lưu.</div>'}</div><div class="panel"><h2>Hoạt động viết</h2>${drafts.length?drafts.map(([key,d])=>`<div class="list-item"><div><h3>${escapeHtml(short(d.prompt||'Bài viết chưa đặt đề',80))}</h3><div class="meta">${countWords(d.full)} từ · ${d.versions.length} phiên bản · ${escapeHtml(fmt(d.updatedAt))}</div></div><button class="btn secondary small" data-action="go-draft" data-key="${escapeHtml(key)}">Mở</button></div>`).join(''):'<div class="empty">Chưa có bản nháp được lưu.</div>'}</div></div><div class="notice">Hồ sơ này chỉ phản ánh hoạt động trên thiết bị hiện tại; chưa tổng hợp dữ liệu từ nhiều máy và chưa đánh giá mức độ tiến bộ theo rubric. Tránh lưu thông tin nhạy cảm khi sử dụng máy dùng chung.</div>`;}
function downloadJson(name,obj){const content=JSON.stringify(obj,null,2);downloadFile(name,content,'application/json;charset=utf-8');}
function downloadFile(name,body,type){let blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function backup(){downloadJson('HLS-sao-luu-'+new Date().toISOString().slice(0,10)+'.json',{format:'hls-backup-v1',createdAt:now(),data:db});notify('Đã tạo tệp sao lưu. Hãy giữ ở nơi an toàn.');}
function showDialog(html){byId('dialogBody').innerHTML=html;byId('dialog').showModal();}
function closeDialog(){byId('dialog').close();}
function addTextForm(){showDialog(`<div class="eyebrow">THƯ VIỆN NGỮ LIỆU</div><h2>Thêm văn bản</h2><p class="small">Chỉ nhập nội dung có quyền sử dụng. Ngữ liệu được lưu trên máy này.</p><div class="form-grid"><div class="field"><label for="newTitle">Nhan đề *</label><input id="newTitle" maxlength="140"></div><div class="field"><label for="newAuthor">Tác giả / xuất xứ</label><input id="newAuthor" maxlength="140"></div><div class="field"><label for="newGrade">Khối lớp</label><select id="newGrade">${Array.from({length:7},(_,i)=>`<option value="${i+6}" ${db.grade===i+6?'selected':''}>Lớp ${i+6}</option>`).join('')}</select></div><div class="field"><label for="newGenre">Thể loại</label><select id="newGenre"><option>Thơ</option><option>Truyện</option><option>Nghị luận</option><option>Thông tin</option><option>Khác</option></select></div><div class="field full"><label for="newSource">Nguồn / quyền khai thác</label><input id="newSource" maxlength="250" placeholder="Tên sách, đường dẫn, tài liệu tự biên soạn…"></div><div class="field full"><label for="newBody">Nội dung văn bản *</label><textarea id="newBody" style="min-height:160px" maxlength="45000"></textarea></div><div class="field full"><label for="newQuestions">Câu hỏi đọc hiểu (mỗi dòng một câu)</label><textarea id="newQuestions" maxlength="5000" placeholder="Câu hỏi 1…&#10;Câu hỏi 2…"></textarea></div></div><button type="button" class="btn" id="doAddText">Lưu văn bản vào thư viện</button>`);byId('doAddText').addEventListener('click',()=>{let title=byId('newTitle').value.trim(),body=byId('newBody').value.trim();if(!title||body.length<20){notify('Cần nhập nhan đề và nội dung từ 20 kí tự.');return;}let id=uid(),q=byId('newQuestions').value.trim().split(/\n+/).map(s=>s.trim()).filter(Boolean).slice(0,20);db.texts.push({id,title,author:byId('newAuthor').value.trim()||'Chưa rõ',genre:byId('newGenre').value,grade:Number(byId('newGrade').value),source:byId('newSource').value.trim()||'Nguồn chưa xác định',body,questions:q.map(question=>({id:uid(),q:question})),editable:true});selectedText=id;db.grade=Number(byId('newGrade').value);persist();closeDialog();go('reading');notify('Đã thêm văn bản và mở trong Phòng đọc.');});}
function importWith(kind){let f=byId('fileInput');f.value='';importCallback=kind;f.click();}
function safeFormatObj(o){return o&&typeof o==='object'&&!Array.isArray(o);}
async function doImport(file){if(!file)return;if(file.size>2_500_000){notify('Tệp quá lớn. Giới hạn 2,5 MB.');return;}try{let obj=JSON.parse(await file.text());if(!safeFormatObj(obj))throw Error('Không đúng cấu trúc JSON');if(importCallback==='backup'){if(obj.format!=='hls-backup-v1'||!safeFormatObj(obj.data)||!Array.isArray(obj.data.texts)||obj.data.schema!==1)throw Error('Không đúng định dạng sao lưu HLS');if(!confirm('Khôi phục sẽ thay thế toàn bộ dữ liệu hiện có trên thiết bị. Bạn chắc chắn?'))return;db={...blank(),...obj.data};if(!persist())return;selectedText=db.texts[0]?.id||'poem-deongang';selectedAssignment='';go('home');notify('Đã khôi phục bản sao lưu.');return;}
if(importCallback==='assignment'){if(obj.format!=='hls-assignment-v1'||!safeFormatObj(obj.assignment)||!safeFormatObj(obj.text))throw Error('Tệp bài tập không đúng định dạng');let t=obj.text,a=obj.assignment;if(typeof t.title!=='string'||typeof t.body!=='string'||t.body.length>45000||!Array.isArray(t.questions)||!t.id||!a.id||!a.textId||a.textId!==t.id)throw Error('Thiếu ngữ liệu trong bài tập');if(!db.texts.some(x=>x.id===t.id))db.texts.push({...t,editable:false});if(!db.assignments.some(x=>x.id===a.id))db.assignments.push(a);selectedText=t.id;selectedAssignment=a.id;db.grade=Number(t.grade)||8;persist();go('reading');notify('Đã nhập bài tập, bắt đầu đọc hiểu.');return;}
if(importCallback==='submission'){if(obj.format!=='hls-submission-v1'||!safeFormatObj(obj.submission)||typeof obj.submission.content!=='string')throw Error('Tệp bài nộp không đúng định dạng');let s=obj.submission;if(s.content.length>80000||typeof s.studentCode!=='string')throw Error('Bài nộp không hợp lệ');if(!db.submissions.some(x=>x.id===s.id))db.submissions.push(s);persist();go('teacher');notify('Đã nhập bài nộp.');return;}throw Error('Không xác định chức năng nhập');}catch(e){notify('Không thể nhập tệp: '+e.message);}}
function exportAssignment(id){let a=db.assignments.find(x=>x.id===id);if(!a)return;let text=textOf(a.textId);downloadJson('HLS-bai-giao-'+id.slice(0,8)+'.json',{format:'hls-assignment-v1',exportedAt:now(),assignment:a,text});notify('Đã tải tệp giao bài.');}
function saveVersion(){let d=draft();if(!d.full.trim()){notify('Hãy viết bản hoàn chỉnh trước khi lưu phiên bản.');return;}let v={id:uid(),time:now(),full:d.full,steps:{...d.steps},prompt:d.prompt};d.versions.push(v);if(d.versions.length>60)d.versions=d.versions.slice(-60);saveDraft();render();notify('Đã lưu phiên bản bài viết.');}
function assemble(){let d=draft();if(d.full.trim() && !confirm('Bản viết hoàn chỉnh hiện có sẽ được thay bằng nội dung ghép từ các bước. Tiếp tục?'))return;d.full=templates[templateId].steps.map((a,i)=>String(d.steps[i]||'').trim()).filter(Boolean).join('\n\n');saveDraft();render();notify('Đã tạo bản nháp. Hãy chỉnh lại để diễn đạt tự nhiên.');}
function exportWriting(){let d=draft(),t=currentText();if(!d.full.trim()){notify('Chưa có bản viết hoàn chỉnh để xuất.');return;}let content=['HLS – HỌC NGỮ VĂN SỐ','Ngữ liệu: '+t.title,'Tác giả: '+t.author,'Đề bài: '+d.prompt,'Ngày xuất: '+fmt(now()),'','BÀI VIẾT','',d.full].join('\n');downloadFile('HLS-bai-viet-'+new Date().toISOString().slice(0,10)+'.txt','\ufeff'+content,'text/plain;charset=utf-8');}
function submitWriting(){let d=draft();if(!d.full.trim()){notify('Cần hoàn thành phần viết trước khi đóng gói bài nộp.');return;}showDialog(`<h2>Đóng gói bài nộp</h2><p>Nhập mã nhận diện do giáo viên quy định (không cần ghi đầy đủ họ tên). Tệp bài nộp chỉ được tạo và tải về, không gửi lên máy chủ.</p><div class="field"><label for="studentCode">Mã học sinh / kí hiệu *</label><input id="studentCode" maxlength="50" autocomplete="off" placeholder="VD: 8A-01"></div><div class="notice">Tệp JSON chứa toàn bộ bài viết, câu trả lời đọc hiểu và thông tin mã học sinh đã nhập. Chỉ gửi tệp cho người có trách nhiệm.</div><button id="doSubmit" class="btn" type="button">↓ Tải tệp bài nộp</button>`);byId('doSubmit').addEventListener('click',()=>{let code=byId('studentCode').value.trim();if(!code){notify('Cần nhập mã học sinh.');return;}let a=assignment(),t=currentText(),s=session(selectedText),d=draft();let obj={id:uid(),assignmentId:a?.id||'',assignmentTitle:a?.title||d.prompt,studentCode:code,submittedAt:now(),textId:t.id,textTitle:t.title,prompt:d.prompt,content:d.full,readingAnswers:s.answers,evidence:s.evidence,template:templateId};downloadJson('HLS-bai-nop-'+code.replace(/[^\w-]/g,'_').slice(0,30)+'.json',{format:'hls-submission-v1',submission:obj});closeDialog();notify('Đã tạo tệp bài nộp để gửi giáo viên.');});}
function inspectSubmission(id){let s=db.submissions.find(x=>x.id===id);if(!s)return;showDialog(`<div class="eyebrow">BÀI NỘP ĐÃ NHẬP</div><h2>${escapeHtml(s.studentCode)} · ${escapeHtml(s.assignmentTitle||'')}</h2><div class="meta">${escapeHtml(fmt(s.submittedAt))} · ${countWords(s.content)} từ</div><div class="divider"></div><div class="preview">${escapeHtml(s.content)}</div><div class="divider"></div><h3>Câu trả lời đọc hiểu</h3>${Object.entries(s.readingAnswers||{}).map(([k,v])=>`<div class="excerpt">${escapeHtml(v)}</div>`).join('')||'<p class="muted small">Không có dữ liệu trả lời.</p>'}<p class="small muted">Phiên bản này chưa tích hợp chấm/ghi nhận xét trực tuyến.</p>`);}
function restoreVersion(id){let d=draft(),v=d.versions.find(v=>v.id===id);if(!v)return;showDialog(`<h2>Bản viết ${escapeHtml(fmt(v.time))}</h2><div class="preview">${escapeHtml(v.full)}</div><div class="actions" style="margin-top:15px"><button type="button" class="btn" id="confirmRestore">Khôi phục bản này</button></div>`);byId('confirmRestore').onclick=()=>{if(!confirm('Thay nội dung đang soạn bằng phiên bản này? Các phiên bản đã lưu vẫn được giữ.'))return;d.full=v.full;d.steps={...v.steps};d.prompt=v.prompt;saveDraft();closeDialog();render();notify('Đã khôi phục bản viết.');};}
function openBackupDialog(){showDialog(`<h2>Sao lưu và khôi phục</h2><p>HLS 0.1 lưu dữ liệu bằng localStorage trong trình duyệt này. Dữ liệu có thể mất nếu bạn xóa dữ liệu trình duyệt, dùng chế độ ẩn danh hoặc thay thiết bị.</p><div class="actions"><button type="button" class="btn" id="doBackup">↓ Tải bản sao lưu JSON</button><button type="button" class="btn secondary" id="doRestore">↑ Chọn tệp khôi phục</button></div><div class="notice">Tệp sao lưu chưa được mã hóa; có thể chứa bài làm và mã học sinh. Hãy lưu ở nơi an toàn, không đăng công khai.</div>`);byId('doBackup').onclick=backup;byId('doRestore').onclick=()=>{closeDialog();importWith('backup');};}
function executeAction(action,el){let id=el.dataset.id;switch(action){case'open-add-text':addTextForm();break;case'read-text':selectedText=id;selectedAssignment='';go('reading');break;case'write-text':selectedText=id;selectedAssignment='';go('writing');break;case'remove-text':if(!confirm('Xóa văn bản này khỏi thư viện trên thiết bị?'))return;db.texts=db.texts.filter(t=>t.id!==id||!t.editable);if(selectedText===id)selectedText=db.texts[0].id;persist();render();notify('Đã xóa ngữ liệu.');break;case'mark-yellow':case'mark-blue':case'mark-green':addMark(action.split('-')[1]);break;case'add-evidence':addEvidence();break;case'remove-evidence':{let s=session(selectedText);s.evidence=s.evidence.filter(e=>e.id!==id);persist();render();break;}case'clear-pending':pendingSelection=null;window.getSelection()?.removeAllRanges();notify('Đã bỏ vùng chọn.');break;case'compose':assemble();break;case'clear-steps':if(!confirm('Xóa các ô viết theo bước? Nội dung hoàn chỉnh và phiên bản đã lưu vẫn được giữ.'))return;draft().steps={};saveDraft();render();break;case'snapshot':saveVersion();break;case'copy-draft':{let content=draft().full;if(!content.trim()){notify('Chưa có bài viết để sao chép.');return;}navigator.clipboard?.writeText(content).then(()=>notify('Đã sao chép bài viết.')).catch(()=>notify('Trình duyệt không cho phép sao chép tự động.'));break;}case'export-writing':exportWriting();break;case'insert-evidence':{let ev=session(selectedText).evidence.find(x=>x.id===id);if(!ev)return;let d=draft(),index=templates[templateId].steps.findIndex(x=>/Dẫn|Bằng chứng/.test(x[0]));if(index<0)index=2;let prev=d.steps[index]||'';d.steps[index]=prev+(prev?' ':'')+'“'+ev.text+'”';saveDraft();render();notify('Đã chèn vào bước dẫn chứng; hãy thêm lời phân tích.');break;}case'restore-version':restoreVersion(id);break;case'export-backup':backup();break;case'import-backup':importWith('backup');break;case'import-assignment':importWith('assignment');break;case'import-submission':importWith('submission');break;case'export-assignment':exportAssignment(id);break;case'open-assignment':{let a=db.assignments.find(x=>x.id===id);if(!a)return;selectedAssignment=id;selectedText=a.textId;go('reading');break;}case'create-assignment':{let title=byId('taskTitle').value.trim(),prompt=byId('taskPrompt').value.trim();if(!title||!prompt){notify('Cần nhập tên nhiệm vụ và đề viết.');return;}let a={id:uid(),title,textId:byId('taskText').value,classLabel:byId('taskClass').value.trim(),prompt,createdAt:now()};db.assignments.push(a);selectedAssignment=a.id;selectedText=a.textId;persist();render();notify('Đã lưu nhiệm vụ. Chọn “Tải bài giao” để gửi học sinh.');break;}case'submit-writing':submitWriting();break;case'inspect-submission':inspectSubmission(id);break;case'go-draft':{let bits=el.dataset.key.split('::');if(bits.length!==3)return;selectedAssignment=bits[0]==='self'?'':bits[0];selectedText=bits[1];templateId=templates[bits[2]]?bits[2]:'art';go('writing');break;}default:notify('Chức năng đang phát triển.');}}
// Interactions: use delegation so content can rerender safely.
document.addEventListener('click',e=>{let route=e.target.closest('[data-go]');if(route){go(route.dataset.go);return;}let btn=e.target.closest('[data-action]');if(btn){executeAction(btn.dataset.action,btn);return;}});
document.addEventListener('keydown',e=>{let card=e.target.closest('.card.clickable');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go(card.dataset.go);}});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='grade'){db.grade=Number(el.value);persist();render();return;}if(el.id==='textPick'){selectedText=el.value;selectedAssignment='';pendingSelection=null;render();return;}if(el.id==='assignPick'){selectedAssignment=el.value;let a=assignment();if(a)selectedText=a.textId;render();return;}if(el.id==='templatePick'){templateId=el.value;render();return;}});
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.answer){session(selectedText).answers[el.dataset.answer]=el.value;session(selectedText).updatedAt=now();persist();return;}if(el.dataset.step!==undefined){draft().steps[el.dataset.step]=el.value;saveDraft();return;}if(el.id==='writingPrompt'){draft().prompt=el.value;saveDraft();return;}if(el.id==='fullDraft'){draft().full=el.value;saveDraft();let w=byId('wordCount');if(w)w.textContent=countWords(el.value)+' từ';return;}});
document.addEventListener('mouseup',e=>{if(e.target.closest('#readerText'))storeSelection();});
